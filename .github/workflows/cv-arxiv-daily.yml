name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */5 * *"

env:
  GITHUB_USER_NAME: Bestboy125
  GITHUB_USER_EMAIL: 673823721@qq.com

# 【修复 1】增加写入权限，允许 Action 推送代码到仓库
permissions:
  contents: write

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python Env
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install "arxiv<2.0.0" 
                pip install requests pyyaml

      - name: Run daily arxiv 
        run: |
          python daily_arxiv.py

      # 【修复 2】使用原生 Git 替代旧版 Action，并处理“无更新时报错”的问题
      - name: Commit and Push changes
        run: |
          git config --local user.email "${{ env.GITHUB_USER_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_USER_NAME }}"
          
          # 强制添加所需文件（即使被 .gitignore 忽略也可添加，如果不需要强制可以去掉 -f）
          git add README.md docs/cv-arxiv-daily.json docs/cv-arxiv-daily-web.json docs/index.md docs/cv-arxiv-daily-wechat.json docs/wechat.md
          
          # 判断工作区是否有更改，如果有更改才执行 commit 和 push，防止没有新论文时 workflow 报错失败
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Automatic Update CV Arxiv Papers"
            git push
          else
            echo "No changes to commit today."
          fi
